<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sign In — NeuroScan AI</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    body{background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .auth-wrap{width:100%;max-width:440px}
    .auth-logo{text-align:center;margin-bottom:32px}
    .auth-logo h1{font-family:var(--font-d);font-size:2rem;color:var(--text);margin-top:12px}
    .auth-logo p{color:var(--muted);font-size:.9rem;margin-top:6px}
    .auth-box{background:var(--card);border-radius:20px;padding:36px;box-shadow:var(--shadow-md);border:1px solid var(--border)}
    .tab-bar{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:28px}
    .tab-btn{padding:9px;border-radius:8px;border:none;background:transparent;font-size:.88rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s}
    .tab-btn.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.07)}
    .google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px;border:2px solid var(--border);border-radius:12px;background:#fff;font-size:.95rem;font-weight:600;cursor:pointer;color:var(--text);transition:all .22s;margin-bottom:22px}
    .google-btn:hover{border-color:var(--primary);box-shadow:var(--shadow)}
    .google-btn svg{flex-shrink:0}
    .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.78rem;margin-bottom:22px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:.83rem;font-weight:600;margin-bottom:7px;color:var(--text)}
    .form-group input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:.9rem;background:var(--bg);color:var(--text);transition:border-color .2s;outline:none}
    .form-group input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,106,79,.1)}
    .auth-submit{width:100%;background:var(--primary);color:#fff;border:none;padding:13px;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .22s;margin-top:6px}
    .auth-submit:hover{background:var(--primary-d);transform:translateY(-1px)}
    .auth-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .auth-error{background:#fde8d8;color:#c44b1b;border-radius:10px;padding:11px 14px;font-size:.84rem;margin-bottom:16px;display:none}
    .auth-error.show{display:block}
    .user-badge{background:var(--green-bg);border-radius:14px;padding:22px;text-align:center;display:none}
    .user-badge.show{display:block}
    .user-avatar{width:60px;height:60px;border-radius:50%;margin:0 auto 12px;object-fit:cover;border:3px solid var(--primary-l)}
    .user-name{font-weight:700;font-size:1.1rem;color:var(--text)}
    .user-email{color:var(--muted);font-size:.84rem;margin-top:3px}
    .go-btn{display:inline-block;background:var(--primary);color:#fff;padding:10px 28px;border-radius:50px;font-size:.9rem;font-weight:700;margin-top:16px;cursor:pointer;border:none;text-decoration:none}
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <a href="../index.html" style="text-decoration:none">
      <div style="width:56px;height:56px;background:var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto">🧠</div>
      <h1>NeuroScan AI</h1>
      <p>AI-Powered Neurodevelopmental Screening · Multi-Disorder Detection</p>
    </a>
  </div>

  <!-- Already logged in card -->
  <div class="user-badge" id="userBadge">
    <img id="userAvatar" class="user-avatar" src="" alt=""/>
    <div class="user-name" id="userName"></div>
    <div class="user-email" id="userEmail"></div>
    <a href="../pages/profile.html" class="go-btn">Go to Dashboard →</a>
    <button onclick="handleSignOut()" style="display:block;margin:10px auto 0;background:none;border:none;color:var(--muted);font-size:.82rem;cursor:pointer">Sign out</button>
  </div>

  <div class="auth-box" id="authBox">
    <!-- Tabs: Login / Sign Up -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- Google sign-in -->
    <button class="google-btn" onclick="handleGoogle()">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8H6.1C9.4 36.5 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.3 4.1-4.1 5.5l6.2 5.2C37 40.5 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <div class="auth-error" id="authError"></div>

    <!-- Login form -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')handleEmailLogin()"/>
      </div>
      <button class="auth-submit" id="loginBtn" onclick="handleEmailLogin()">Sign In →</button>
    </div>

    <!-- Signup form -->
    <div id="signupForm" style="display:none">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="signupName" placeholder="Full Name"/>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Min 6 characters"/>
      </div>
      <button class="auth-submit" id="signupBtn" onclick="handleEmailSignup()">Create Account →</button>
    </div>
  </div>

  <p style="text-align:center;color:var(--muted);font-size:.76rem;margin-top:20px;line-height:1.6">
    By signing in you agree to our Terms of Service.<br/>
    Your data is stored securely. Not for medical diagnosis.
  </p>
</div>

<script type="module">
import { signInWithGoogle, signInEmail, signUpEmail, firebaseSignOut, onAuthChange } from '../js/mongodb.js';

window.handleGoogle = async () => {
  setLoading(true);
  try {
    await signInWithGoogle();
    window.location.href = '../pages/profile.html';
  } catch(e) { showError(e.message); setLoading(false); }
};

window.handleEmailLogin = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPassword').value;
  if (!email || !pass) { showError('Please fill all fields'); return; }
  setLoading(true);
  try {
    await signInEmail(email, pass);
    window.location.href = '../pages/profile.html';
  } catch(e) { showError(friendlyError(e.code)); setLoading(false); }
};

window.handleEmailSignup = async () => {
  const name  = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const pass  = document.getElementById('signupPassword').value;
  if (!name || !email || !pass) { showError('Please fill all fields'); return; }
  if (pass.length < 6) { showError('Password must be at least 6 characters'); return; }
  setLoading(true);
  try {
    await signUpEmail(email, pass, name);
    window.location.href = '../pages/profile.html';
  } catch(e) { showError(friendlyError(e.code)); setLoading(false); }
};

window.handleSignOut = async () => {
  await firebaseSignOut();
  document.getElementById('userBadge').classList.remove('show');
  document.getElementById('authBox').style.display = '';
};

window.switchTab = (tab) => {
  document.getElementById('loginForm').style.display  = tab === 'login'  ? '' : 'none';
  document.getElementById('signupForm').style.display = tab === 'signup' ? '' : 'none';
  document.getElementById('tabLogin').classList.toggle('active',  tab === 'login');
  document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
};

// Check if already logged in
onAuthChange(user => {
  if (user) {
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('userBadge').classList.add('show');
    document.getElementById('userAvatar').src   = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName||'U')}&background=2d6a4f&color=fff`;
    document.getElementById('userName').textContent  = user.displayName || 'User';
    document.getElementById('userEmail').textContent = user.email;
  }
});

function setLoading(on) {
  ['loginBtn','signupBtn'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.disabled = on; el.textContent = on ? 'Please wait...' : (id==='loginBtn'?'Sign In →':'Create Account →'); }
  });
}

function showError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

function friendlyError(code) {
  const map = {
    'auth/user-not-found': 'No account found with this email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/email-already-in-use': 'Email already registered.',
    'auth/weak-password': 'Password too weak (min 6 chars).',
    'auth/invalid-email': 'Invalid email address.',
  };
  return map[code] || 'Authentication failed. Please try again.';
}
</script>
</body>
</html>
